name: v4 Execution Audit (diagnostic only)
on:
  push:
    branches:
      - 'audit/fill-confirmed-reductions-20261019'
    paths:
      - '.github/workflows/audit-v4.yml'
jobs:
  forensic-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Freeze original v4 report locally
        run: cp reports/backtest_v4.md /tmp/pre_fix_backtest_v4.md
      - name: Run v4 complete diagnostic replay (NO fresh OOS claim)
        run: |
          python scripts/run_backtest_v4.py > audit-v4.log 2>&1 || {
            tail -n 150 audit-v4.log
            exit 1
          }
          tail -n 90 audit-v4.log
      - name: Show frozen vs corrected report top lines
        run: |
          echo "=== OLD, PRE-FIX REPORT ==="
          sed -n '1,45p' /tmp/pre_fix_backtest_v4.md
          echo "=== NEW, DIAGNOSTIC ONLY ==="
          sed -n '1,45p' reports/backtest_v4.md
      - uses: actions/upload-artifact@v4
        with:
          name: v4-execution-audit-diagnostic
          path: |
            reports/backtest_v4.md
            reports/backtest_v4.json
            audit-v4.log
          retention-days: 14
