[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-operator"
version = "0.1.0"
description = "Causal market-structure cognition and falsifiable trading research system for crypto USDT perpetuals"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mo = "market_operator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# research/rounds/ 是历史轮次的冻结快照(自带各自的旧实现副本),
# 不参与活测试收集:它们验证的是当年的代码,不是现行系统。
norecursedirs = ["research", "reports", "data", "node_modules", ".git"]
